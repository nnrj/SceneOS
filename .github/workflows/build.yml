name: build

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  x86_64:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Install ephemeral host tools
        run: |
          sudo apt-get update
          sudo apt-get install --yes \
            clang lld cmake ninja-build nasm xorriso qemu-system-x86 ovmf make

      - name: Fetch pinned project-local boot dependency
        run: python3 tools/scenectl.py bootstrap --yes

      - name: Validate exception dispatch
        run: python3 tools/scenectl.py smoke --exception --timeout 8

      - name: Validate calibrated-TSC clock fallback
        run: python3 tools/scenectl.py smoke --tsc-clock --timeout 8

      - name: Validate clock diagnostic edge cases with HPET
        run: python3 tools/scenectl.py smoke --clock-check --timeout 10

      - name: Validate clock diagnostic edge cases with TSC
        run: python3 tools/scenectl.py smoke --clock-check --tsc-clock --timeout 10

      - name: Validate page-fault diagnostics
        run: python3 tools/scenectl.py smoke --page-fault --timeout 8

      - name: Validate Local APIC timer with HPET calibration
        run: python3 tools/scenectl.py smoke --lapic-timer --timeout 10

      - name: Validate Local APIC timer with PIT calibration
        run: python3 tools/scenectl.py smoke --lapic-timer --tsc-clock --timeout 10

      - name: Validate legacy PIC and PIT compatibility
        run: python3 tools/scenectl.py smoke --lapic-timer --pic --timeout 10

      - name: Validate Local APIC timer in Release
        run: python3 tools/scenectl.py smoke --preset release --lapic-timer --timeout 10

      - name: Validate PS/2 keyboard input
        run: python3 tools/scenectl.py smoke --keyboard --timeout 10

      - name: Validate PS/2 mouse input
        run: python3 tools/scenectl.py smoke --mouse --timeout 10

      - name: Validate keyboard through legacy PIC
        run: python3 tools/scenectl.py smoke --keyboard --pic --timeout 10

      - name: Validate mouse through cascaded legacy PIC
        run: python3 tools/scenectl.py smoke --mouse --pic --timeout 10

      - name: Validate IntelliMouse wheel and packet boundaries
        run: python3 tools/scenectl.py smoke --mouse-wheel --timeout 15

      - name: Validate wheel through cascaded legacy PIC
        run: python3 tools/scenectl.py smoke --mouse-wheel --pic --timeout 15

      - name: Validate three-byte mouse compatibility
        run: python3 tools/scenectl.py smoke --mouse-basic --timeout 15

      - name: Validate three-byte mouse through legacy PIC
        run: python3 tools/scenectl.py smoke --mouse-basic --pic --timeout 15

      - name: Validate IntelliMouse in Release
        run: python3 tools/scenectl.py smoke --preset release --mouse-wheel --timeout 15

      - name: Validate keyboard text and UTF-8
        run: python3 tools/scenectl.py smoke --text-input --timeout 15

      - name: Validate keyboard text through legacy PIC
        run: python3 tools/scenectl.py smoke --text-input --pic --timeout 15

      - name: Validate keyboard text with the TSC clock
        run: python3 tools/scenectl.py smoke --text-input --tsc-clock --timeout 15

      - name: Validate keyboard text in Release
        run: python3 tools/scenectl.py smoke --preset release --text-input --timeout 15

      - name: Validate cooperative kernel threads
        run: python3 tools/scenectl.py smoke --threads --timeout 15

      - name: Validate threads with the legacy PIC
        run: python3 tools/scenectl.py smoke --threads --pic --timeout 15

      - name: Validate threads with the TSC clock
        run: python3 tools/scenectl.py smoke --threads --tsc-clock --timeout 15

      - name: Validate threads in Release
        run: python3 tools/scenectl.py smoke --preset release --threads --timeout 15

      - name: Validate worker stack guard page
        run: python3 tools/scenectl.py smoke --thread-guard --timeout 15

      - name: Validate worker stack guard page in Release
        run: python3 tools/scenectl.py smoke --preset release --thread-guard --timeout 15

      - name: Build ordinary bootable image
        run: python3 tools/scenectl.py image

      - name: Run serial smoke test
        run: |
          set +e
          timeout 15s qemu-system-x86_64 \
            -machine q35 \
            -m 256M \
            -display none \
            -no-reboot \
            -no-shutdown \
            -serial file:build/dev/serial.log \
            -cdrom build/dev/sceneos.iso \
            -boot d
          set -e
          grep -F "SceneOS kernel bootstrap" build/dev/serial.log
          grep -F "Bootstrap complete" build/dev/serial.log

      - name: Upload image and serial log
        uses: actions/upload-artifact@v4
        with:
          name: sceneos-x86_64
          path: |
            build/dev/sceneos.iso
            build/dev/serial.log
